server:
  compression:
    # Apagada por defecto en Spring Boot, y se notaba: el trozo de entrada del cliente viajaba a
    # 317 kB aunque el navegador pidiera gzip. Comprimido son unos 103 kB, la tercera parte.
    enabled: true
    mime-types: text/html,text/css,text/plain,application/javascript,text/javascript,application/json
    # Por debajo de 1 KB comprimir cuesta mas CPU de lo que ahorra en red.
    min-response-size: 1KB

spring:
  application:
    name: financetracker-monolith-api


  datasource:
    url: jdbc:postgresql://localhost:5432/financetracker
    username: financetracker_user
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    # Sin database-platform: Hibernate detecta el dialecto de PostgreSQL solo y avisaba por
    # consola de que declararlo sobra (HHH90000025).
    #
    # show-sql apagado: imprimia las ~100 sentencias de cualquier flujo, y con format-sql cada una
    # ocupaba varias lineas. Ese coste se paga en cada peticion y enterraba el log de la
    # aplicacion. Para volver a verlo puntualmente basta con subir el nivel de
    # org.hibernate.SQL a DEBUG, sin tocar esto.
    show-sql: false
    # El patron Open Session In View mantiene abierta la sesion de JPA (y con ella la conexion)
    # durante el renderizado de la respuesta. Aqui no hace falta y sale caro: todos los servicios
    # arman el DTO dentro de su @Transactional, asi que cuando el controller devuelve ya no queda
    # nada perezoso que resolver. Apagarlo libera la conexion al salir del servicio en vez de al
    # terminar la peticion, que es lo que decide cuantas peticiones simultaneas aguanta el pool.
    open-in-view: false
    hibernate:
      ddl-auto: update

jwt:
  secret: QWRyaWFuMDMxMCBtaSBjbGF2ZSBlcyBtdXkgc2VndXJh
  expiration: 30

ai:
  api-key: ${API_KEY}
  model: openai/gpt-oss-20b:free
  # Los defaults de la libreria, explicitos para que no cambien al actualizarla.
  connect-timeout: 10s
  # De INACTIVIDAD, no de duracion: no acota lo que tarda una llamada, solo caza al que enmudece.
  # El tope total esta en AIServiceImpl.TOTAL_TIMEOUT.
  read-timeout: 60s

logging:
  level:
    # El root se queda en INFO: con DEBUG global, Spring, Hibernate y Tomcat entierran lo propio.
    # Solo el paquete de la aplicacion baja a DEBUG, que es donde estan los importes, los saldos,
    # los rangos de los informes y los tiempos del modelo.
    com.adrian.financetracker_monolith_api: DEBUG
  pattern:
    # Al patron por defecto le falta lo unico que hace util un log de una API: que peticion es.
    # %X{...} lee el MDC que rellena LoggingFilter, asi que las lineas sueltas de una peticion se
    # pueden juntar aunque haya varias a la vez.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{0} - %msg%n"

